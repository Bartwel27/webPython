<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Runner · Pyodide</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-2: #273449;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #a78bfa;
            --accent-hover: #8b5cf6;
            --ok: #22c55e;
            --err: #f87171;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 32px 16px;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1e1b4b 0%, var(--bg) 60%);
            color: var(--text);
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }
        .wrap { max-width: 900px; margin: 0 auto; }
        header { margin-bottom: 24px; }
        h1 {
            font-size: 1.6rem;
            margin: 0 0 6px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        h1 span { color: var(--accent); }
        .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0; }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding: 6px 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.8rem;
            color: var(--muted);
        }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
        }
        .status.ready .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
        .status.error .dot { background: var(--err); box-shadow: 0 0 8px var(--err); }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.25);
        }
        .card-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 10px;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            min-height: 240px;
            resize: vertical;
            background: #0b1120;
            color: #e2e8f0;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
            font-size: 14px;
            line-height: 1.55;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(167,139,250,0.15);
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        button {
            background: var(--accent);
            color: #0b1120;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
        }
        button:hover:not(:disabled) { background: var(--accent-hover); }
        button:active:not(:disabled) { transform: translateY(1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.ghost {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        button.ghost:hover:not(:disabled) { background: var(--panel-2); }
        #output {
            background: #0b1120;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            min-height: 100px;
            max-height: 380px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #cbd5e1;
            margin: 0;
        }
        #output:empty::before {
            content: "Output will appear here…";
            color: var(--muted);
            font-style: italic;
        }
        #plot-area {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }
        #plot-area img {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: white;
        }
        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
            margin-top: 24px;
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>Python Runner · <span>Pyodide</span></h1>
        <p class="subtitle">Real CPython in the browser — NumPy, Matplotlib, and pure-Python packages.</p>
        <div class="status" id="status">
            <span class="dot"></span>
            <span id="status-text">Loading Pyodide…</span>
        </div>
    </header>

    <div class="card">
        <div class="card-label">Code</div>
        <textarea id="yourcode" spellcheck="false">import sys
print("Python", sys.version)
print("Hello, World!")

import numpy as np
a = np.array([1, 2, 3, 4, 5])
print("numpy array:", a)
print("sum:", a.sum(), "mean:", a.mean())

# Uncomment for a Matplotlib plot:
# import matplotlib.pyplot as plt
# plt.plot([1,2,3,4], [1,4,9,16], marker="o")
# plt.title("Squares")
# plt.show()</textarea>
        <div class="toolbar">
            <button id="runBtn" onclick="runit()" disabled>▶ Run</button>
            <button class="ghost" onclick="installAndRun()" id="installBtn" disabled>＋ Install &amp; Run</button>
            <button class="ghost" onclick="clearOutput()">Clear</button>
        </div>
    </div>

    <div class="card">
        <div class="card-label">Output</div>
        <pre id="output"></pre>
        <div id="plot-area"></div>
    </div>

    <footer>Powered by Pyodide · Full CPython · First load downloads the runtime</footer>
</div>

<script>
    let pyodide = null;
    let isReady = false;

    function appendOutput(text) {
        const out = document.getElementById("output");
        out.textContent += text;
        out.scrollTop = out.scrollHeight;
    }
    function clearOutput() {
        document.getElementById("output").textContent = "";
        document.getElementById("plot-area").innerHTML = "";
    }
    function setStatus(state, text) {
        const el = document.getElementById("status");
        el.className = "status " + state;
        document.getElementById("status-text").textContent = text;
    }

    async function initPyodide() {
        try {
            pyodide = await loadPyodide({
                stdout: (s) => appendOutput(s + "\n"),
                stderr: (s) => appendOutput(s + "\n"),
            });
            isReady = true;
            const ver = pyodide.runPython("import sys; sys.version.split()[0]");
            setStatus("ready", "Pyodide ready · Python " + ver);
            document.getElementById("runBtn").disabled = false;
            document.getElementById("installBtn").disabled = false;

            // Matplotlib hook: turn plt.show() into an <img> on the page.
            await pyodide.runPythonAsync(`
import sys, io, base64
try:
    import matplotlib
    matplotlib.use("AGG")
    import matplotlib.pyplot as plt
    from js import document

    def _show(*args, **kwargs):
        buf = io.BytesIO()
        plt.savefig(buf, format="png", bbox_inches="tight")
        buf.seek(0)
        data = base64.b64encode(buf.read()).decode()
        img = document.createElement("img")
        img.src = "data:image/png;base64," + data
        document.getElementById("plot-area").appendChild(img)
        plt.close("all")
    plt.show = _show
except Exception:
    pass
`);
        } catch (err) {
            setStatus("error", "Failed to load Pyodide");
            appendOutput("Load error: " + err + "\n");
            console.error(err);
        }
    }

    async function runit() {
        if (!isReady) return;
        clearOutput();
        const code = document.getElementById("yourcode").value;
        try {
            await pyodide.runPythonAsync(code);
        } catch (err) {
            appendOutput("\n" + err.toString());
        }
    }

    async function installAndRun() {
        if (!isReady) return;
        const pkg = prompt("Enter a pure-Python package to install (e.g. cowsay, pytz, sympy):");
        if (!pkg) return;
        try {
            appendOutput("Installing " + pkg + "…\n");
            await pyodide.loadPackage("micropip");
            const micropip = pyodide.pyimport("micropip");
            await micropip.install(pkg);
            appendOutput("Installed " + pkg + "\n\n");
            await runit();
        } catch (err) {
            appendOutput("\n" + err.toString());
        }
    }

    initPyodide();
</script>
</body>
</html>
