<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Python Runner with Skulpt</title>
    <!-- jQuery (optional, but kept from original) -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.0/jquery.min.js"></script>
    <!-- Skulpt core and standard library -->
    <script src="https://skulpt.org/js/skulpt.min.js" type="text/javascript"></script>
    <script src="https://skulpt.org/js/skulpt-stdlib.js" type="text/javascript"></script>
    <style>
        body {
            font-family: monospace;
            margin: 20px;
        }
        #output {
            background: #f4f4f4;
            padding: 10px;
            border: 1px solid #ccc;
            min-height: 50px;
            white-space: pre-wrap;
        }
        #mycanvas {
            margin-top: 10px;
            border: 1px solid #aaa;
        }
    </style>
</head>
<body>

<h3>Try This Python Code</h3>
<form>
    <textarea id="yourcode" cols="60" rows="12">

    </textarea><br />
    <button type="button" onclick="runit()">Run</button>
</form>
<pre id="output"></pre>
<!-- Canvas for turtle graphics -->
<div id="mycanvas"></div>

<script type="text/javascript">
    // Output function: appends text to the <pre> element
    function outf(text) {
        var mypre = document.getElementById("output");
        mypre.innerHTML = mypre.innerHTML + text;
    }

    // Builtin file reader for Skulpt
    function builtinRead(x) {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
            throw "File not found: '" + x + "'";
        }
        return Sk.builtinFiles["files"][x];
    }

    // Main run function
    function runit() {
        var prog = document.getElementById("yourcode").value;
        var mypre = document.getElementById("output");
        mypre.innerHTML = '';  // Clear output

        // Configure Skulpt
        Sk.configure({
            output: outf,
            read: builtinRead,
            // Enable turtle graphics (target is the div id)
            __future__: Sk.python3
        });

        // Set up turtle graphics target
        (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = 'mycanvas';

        // Use asyncToPromise for proper async execution
        var myPromise = Sk.misceval.asyncToPromise(function() {
            return Sk.importMainWithBody("<stdin>", false, prog, true);
        });

        myPromise.then(function(mod) {
            console.log('Program finished successfully');
        }, function(err) {
            // Display error in the output area
            var errorMsg = err.toString();
            document.getElementById("output").innerHTML += "\nError: " + errorMsg;
            console.error(err);
        });
    }
</script>

</body>
</html>
